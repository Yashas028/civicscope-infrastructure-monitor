services:
  - type: web
      name: civicscope-infrastructure-monitor
          runtime: node
              plan: free
                  buildCommand: bash render-build.sh
                      startCommand: cd app && npm start
                          healthCheckPath: /healthz
                              envVars:
                                    - key: NODE_ENV
                                            value: production
                                                  - key: DATA_DIRECTORY
                                                          value: /tmp/civicscope-data
                                                                - key: ADMIN_EMAIL
                                                                        sync: false
                                                                              - key: ADMIN_PASSWORD
                                                                                      sync: false
                                                                                            - key: SESSION_SECRET
                                                                                                    generateValue: true
